name: Release

# `v1.2.3` 形式のタグを push すると Marketplace に公開し，GitHub Release に .vsix を添付する．
# 事前に Marketplace の Personal Access Token をリポジトリの Secrets に VSCE_PAT として登録すること．
on:
  push:
    tags: ['v*']
  # Actions タブから手動実行する場合は「Use workflow from」でタグ（例: v0.1.0）を選ぶこと．
  # ブランチを選ぶと version 一致チェックで失敗する．
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run test:unit
      - name: Check tag matches package.json version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "このワークフローはタグ上で実行してください（Use workflow from でタグを選択）．現在: $GITHUB_REF_TYPE $GITHUB_REF_NAME" >&2
            exit 1
          fi
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Package
        run: npx @vscode/vsce package --out "layeredkb-${GITHUB_REF_NAME#v}.vsix"
      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --packagePath "layeredkb-${GITHUB_REF_NAME#v}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: layeredkb-*.vsix
          generate_release_notes: true

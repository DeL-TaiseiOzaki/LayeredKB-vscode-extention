name: parts-ci

on:
  push:
    branches: [main]
    paths:
      - "parts-engine/**"
      - "parts-vscode/**"
      - ".github/workflows/parts-ci.yml"
  pull_request:
    paths:
      - "parts-engine/**"
      - "parts-vscode/**"
      - ".github/workflows/parts-ci.yml"

jobs:
  parts-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parts-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  parts-vscode:
    runs-on: ubuntu-latest
    needs: parts-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build parts-engine (file: dependency)
        working-directory: parts-engine
        run: npm ci && npm run build
      - name: typecheck & bundle extension
        working-directory: parts-vscode
        run: npm ci && npm run typecheck && npm run build
